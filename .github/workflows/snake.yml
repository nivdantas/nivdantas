name: Draw the contribution snake

# Redraws the snake that eats the contribution graph, once a day.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0d0d0d&color_dots=#ededed,#b9b9b9,#828282,#454545,#0d0d0d
            dist/snake-dark.svg?color_snake=#fbfbfb&color_dots=#191919,#454545,#828282,#b9b9b9,#fbfbfb

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Redraw the contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
