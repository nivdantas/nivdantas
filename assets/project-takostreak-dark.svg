<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="TakoStreak: Fluffy streaks for everyone. A small, playful project about showing up, one day at a time."><title>TakoStreak: Fluffy streaks for everyone. A small, playful project about showing up, one day at a time.</title><defs><style>@font-face{font-family:'Geist';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist Mono';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Instrument Serif';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.fade{animation:fade .9s cubic-bezier(0.16, 1, 0.3, 1) both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
.nudge{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(2px,-2px)}}

.creature{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:none}96%{transform:scaleY(.1)}}
.day{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:day 7s cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes day{0%{transform:scaleY(0)}6%,90%{transform:scaleY(1)}96%,100%{transform:scaleY(0)}}
.today{animation:today 1.6s ease-in-out infinite}
@keyframes today{50%{stroke-opacity:.3}}
@media (prefers-reduced-motion: reduce){.day{transform:none}}
