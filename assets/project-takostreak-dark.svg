" height="51" rx="3" fill="none" stroke="#fbfbfb"/><rect class="day" style="animation-delay:1.60s" x="316.0" y="270" width="22" height="52" rx="3" fill="#fbfbfb"/><rect x="316.5" y="270.5" width="21" height="51" rx="3" fill="none" stroke="#fbfbfb"/><rect class="today" x="343.5" y="270.5" width="21" height="51" rx="3" fill="none" stroke="#fbfbfb"/><rect x="370.5" y="270.5" width="21" height="51" rx="3" fill="none" stroke="#fbfbfb"/><text x="300.0" y="348.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#9c9c9c" text-anchor="middle">AN ILLUSTRATIVE WEEK</text><g class="fade"><text x="648.0" y="72.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#9c9c9c" text-anchor="start">SMALL TOOLS, DAILY HABITS</text><rect x="843.5" y="56.5" width="135.64" height="22" rx="11" fill="none" stroke="#9c9c9c"/><circle class="pulse" cx="857.5" cy="67.5" r="3" fill="#fbfbfb"/><text x="867.5" y="72.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#fbfbfb" text-anchor="start">IN DEVELOPMENT</text><text x="645.0" y="142.0" font-family="Instrument Serif" font-size="68" letter-spacing="-1.36" fill="#fbfbfb" text-anchor="start">TakoStreak</text><text x="648.0" y="182.0" font-family="Geist" font-size="20" letter-spacing="-0.30" fill="#fbfbfb" text-anchor="start">Fluffy streaks for everyone. A small, playful project</text><text x="648.0" y="209.0" font-family="Geist" font-size="20" letter-spacing="-0.30" fill="#fbfbfb" text-anchor="start">about showing up, one day at a time.</text><text x="648.0" y="244.0" font-family="Geist" font-size="14" fill="#b9b9b9" text-anchor="start">Built with React, TanStack, Express, and TypeScript. An experiment in</text><text x="648.0" y="265.0" font-family="Geist" font-size="14" fill="#b9b9b9" text-anchor="start">making a simple daily interaction feel a little more personal.</text><rect x="648.0" y="294.0" width="56.3" height="22" rx="11.0" fill="none" stroke="#454545"/><text x="658.0" y="309.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#b9b9b9" text-anchor="start">REACT</text><rect x="710.3" y="294.0" width="78.1" height="22" rx="11.0" fill="none" stroke="#454545"/><text x="720.3" y="309.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#b9b9b9" text-anchor="start">TANSTACK</text><rect x="794.4" y="294.0" width="70.8" height="22" rx="11.0" fill="none" stroke="#454545"/><text x="804.4" y="309.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#b9b9b9" text-anchor="start">EXPRESS</text><rect x="871.2" y="294.0" width="92.6" height="22" rx="11.0" fill="none" stroke="#454545"/><text x="881.2" y="309.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#b9b9b9" text-anchor="start">TYPESCRIPT</text><rect x="648" y="350" width="184.514" height="44" rx="22" fill="#fbfbfb"/><text x="670.0" y="377.0" font-family="Geist" font-size="14" fill="#0d0d0d" text-anchor="start">Explore the source</text><g class="nudge"><path d="M800.514 377L810.514 367M803.514 367H810.514V374" fill="none" stroke="#0d0d0d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>