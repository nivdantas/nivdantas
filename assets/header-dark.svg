<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Nivaldo Dantas, software engineer. Thoughtful code. A personal touch."><title>Nivaldo Dantas, software engineer. Thoughtful code. A personal touch.</title><defs><style>@font-face{font-family:'Instrument Serif';font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist Mono';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Instrument Serif';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.rule{transform-box:fill-box;transform-origin:left;animation:rule 1.2s cubic-bezier(0.16, 1, 0.3, 1) .1s both}
@keyframes rule{from{transform:scaleX(0)}}
