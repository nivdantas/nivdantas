x="215.0" y="318.0" font-family="Geist" font-size="13" fill="#0d0d0d" text-anchor="start">Inventory &amp; prices</text><text x="464.0" y="318.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#0d0d0d" text-anchor="end">SQLITE</text></g><g class="row" style="animation-delay:2.4s"><line x1="215" y1="330" x2="464" y2="330" stroke="#0d0d0d" stroke-opacity=".25"/><text x="215.0" y="352.0" font-family="Geist" font-size="13" fill="#0d0d0d" text-anchor="start">Conversation</text><text x="464.0" y="352.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#0d0d0d" text-anchor="end">GEMINI</text></g></g><g class="fade"><text x="648.0" y="72.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#9c9c9c" text-anchor="start">AI &amp; CONVERSATION</text><text x="645.0" y="142.0" font-family="Instrument Serif" font-size="68" letter-spacing="-1.36" fill="#fbfbfb" text-anchor="start">Bolota</text><text x="648.0" y="182.0" font-family="Geist" font-size="20" letter-spacing="-0.30" fill="#fbfbfb" text-anchor="start">A veterinary assistant that connects natural language</text><text x="648.0" y="209.0" font-family="Geist" font-size="20" letter-spacing="-0.30" fill="#fbfbfb" text-anchor="start">to the information a pet shop actually needs.</text><text x="648.0" y="244.0" font-family="Geist" font-size="14" fill="#b9b9b9" text-anchor="start">Gemini handles the conversation while an Express API connects to a local</text><text x="648.0" y="265.0" font-family="Geist" font-size="14" fill="#b9b9b9" text-anchor="start">SQLite database of prices, inventory, and medications.</text><rect x="648.0" y="294.0" width="63.6" height="22" rx="11.0" fill="none" stroke="#454545"/><text x="658.0" y="309.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#b9b9b9" text-anchor="start">GEMINI</text><rect x="717.6" y="294.0" width="92.6" height="22" rx="11.0" fill="none" stroke="#454545"/><text x="727.6" y="309.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#b9b9b9" text-anchor="start">TYPESCRIPT</text><rect x="816.2" y="294.0" width="70.8" height="22" rx="11.0" fill="none" stroke="#454545"/><text x="826.2" y="309.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#b9b9b9" text-anchor="start">EXPRESS</text><rect x="893.0" y="294.0" width="63.6" height="22" rx="11.0" fill="none" stroke="#454545"/><text x="903.0" y="309.0" font-family="Geist Mono" font-size="11" letter-spacing="0.66" fill="#b9b9b9" text-anchor="start">SQLITE</text><rect x="648" y="350" width="184.514" height="44" rx="22" fill="#fbfbfb"/><text x="670.0" y="377.0" font-family="Geist" font-size="14" fill="#0d0d0d" text-anchor="start">Explore the source</text><g class="nudge"><path d="M800.514 377L810.514 367M803.514 367H810.514V374" fill="none" stroke="#0d0d0d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>