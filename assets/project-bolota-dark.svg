<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Bolota: A veterinary assistant that connects natural language to the information a pet shop actually needs."><title>Bolota: A veterinary assistant that connects natural language to the information a pet shop actually needs.</title><defs><style>@font-face{font-family:'Geist';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist Mono';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Instrument Serif';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.fade{animation:fade .9s cubic-bezier(0.16, 1, 0.3, 1) both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
.nudge{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(2px,-2px)}}

.q{transform-box:fill-box;transform-origin:center;animation:q 6s ease-in-out infinite}
@keyframes q{50%{transform:translateX(-6px) rotate(-1deg)}}
.a{transform-box:fill-box;transform-origin:center;animation:a 6s ease-in-out infinite}
@keyframes a{50%{transform:translateX(6px) rotate(1deg)}}
.drop{animation:drop 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite}
@keyframes drop{0%{transform:none;opacity:0}15%,85%{opacity:1}100%{transform:translateY(57px);opacity:0}}
.typing circle{animation:typing 1.4s ease-in-out infinite}
@keyframes typing{0%,60%,100%{opacity:.25}30%{opacity:1}}
.row{animation:row 4.8s ease-in-out infinite}
@keyframes row{0%,100%{opacity:.55}20%,45%{opacity:1}}
